<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Empleados - Veterinaria')}"></head>
<body>

    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: menu}"></div>

    <hr/>

    <h2>Empleados</h2>
    <a th:href="@{/empleados/nuevo}">+ Nuevo empleado</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Posicion</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${empleados}">
                <td th:text="${e.idEmpleado}">1</td>
                <td th:text="${e.nombre}">Empleado</td>
                <td th:text="${e.posicion}">Posicion</td>
                <td th:text="${e.username}">usuario</td>
                <td th:text="${e.rol}">EMPLEADO</td>
                <td>
                    <a th:href="@{/empleados/editar/{id}(id=${e.idEmpleado})}">Editar</a>
                    <a th:href="@{/empleados/eliminar/{id}(id=${e.idEmpleado})}"
                       onclick="return confirm('¿Eliminar?')">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empleados)}">
                <td colspan="6">No hay empleados registrados</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
