<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a5f,#2c3e50);">
    <div style="background:#fff;border-radius:12px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,0.2);">
        <h2 style="color:#1e3a5f;text-align:center;margin-bottom:0.5rem;"><i class="bi bi-shield-plus"></i> Veterinaria</h2>
        <p style="text-align:center;color:#6c757d;margin-bottom:1.5rem;">Inicia sesion para continuar</p>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i> Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-info" role="alert">
            <i class="bi bi-info-circle"></i> Has cerrado sesion correctamente.
        </div>
        <div th:if="${param.registro}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle"></i> Cuenta creada correctamente. Inicia sesion.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar sesion
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            ¿No tienes cuenta? <a th:href="@{/registro}" class="text-decoration-none">Registrate aqui</a>
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
