<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Clientes - Veterinaria')}"></head>
<body>

    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: menu}"></div>

    <hr/>

    <h2>Clientes</h2>
    <a th:href="@{/clientes/nuevo}">+ Nuevo cliente</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Telefono</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.idCliente}">1</td>
                <td th:text="${c.nombre}">Cliente</td>
                <td th:text="${c.telefono}">123</td>
                <td th:text="${c.correoElectronico}">correo@e.com</td>
                <td>
                    <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}">Editar</a>
                    <a th:href="@{/clientes/eliminar/{id}(id=${c.idCliente})}"
                       onclick="return confirm('¿Eliminar?')">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="5">No hay clientes registrados</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
