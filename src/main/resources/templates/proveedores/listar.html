<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Proveedores - Veterinaria')}"></head>
<body>

    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: menu}"></div>

    <hr/>

    <h2>Proveedores</h2>
    <a th:href="@{/proveedores/nuevo}">+ Nuevo proveedor</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Telefono</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${proveedores}">
                <td th:text="${p.idProveedor}">1</td>
                <td th:text="${p.nombre}">Proveedor</td>
                <td th:text="${p.telefono}">123</td>
                <td th:text="${p.correoElectronico}">correo@e.com</td>
                <td>
                    <a th:href="@{/proveedores/editar/{id}(id=${p.idProveedor})}">Editar</a>
                    <a th:href="@{/proveedores/eliminar/{id}(id=${p.idProveedor})}"
                       onclick="return confirm('¿Eliminar?')">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(proveedores)}">
                <td colspan="5">No hay proveedores registrados</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
