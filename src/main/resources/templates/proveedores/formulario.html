<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Proveedores - Veterinaria')}"></head>
<body>

    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: menu}"></div>

    <hr/>

    <h2>
        <span th:text="${proveedor.idProveedor == null} ? 'Nuevo proveedor' : 'Editar proveedor'"></span>
    </h2>

    <a th:href="@{/proveedores}">Volver</a>

    <form method="post" th:action="@{/proveedores/guardar}" th:object="${proveedor}">
        <input type="hidden" name="idProveedor" th:value="*{idProveedor}"/>
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" th:value="*{nombre}" required/>
        </div>
        <div>
            <label for="telefono">Telefono:</label>
            <input type="text" id="telefono" name="telefono" th:value="*{telefono}"/>
        </div>
        <div>
            <label for="correoElectronico">Correo electronico:</label>
            <input type="email" id="correoElectronico" name="correoElectronico" th:value="*{correoElectronico}"/>
        </div>
        <button type="submit">Guardar</button>
        <a th:href="@{/proveedores}">Cancelar</a>
    </form>

</body>
</html>
